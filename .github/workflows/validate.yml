name: Validate anki-sync-server image

# Builds the image on pull requests (e.g. Dependabot base image bumps) without
# publishing it, so a change that breaks the build or the server fails the PR
# instead of the publish run on main.
on:
  pull_request:
    paths:
      - "Dockerfile"
      - "entrypoint.sh"
      - ".github/workflows/docker-publish.yml"
      - ".github/workflows/validate.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve Anki version
        id: version
        run: |
          VERSION="$(curl -fsSL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" https://api.github.com/repos/ankitects/anki/releases/latest | jq -r .tag_name)"
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "Failed to resolve Anki version" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved Anki version: $VERSION"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Same platforms as the publish workflow, so a build that only breaks on
      # one architecture is caught too.
      - name: Build all platforms
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: |
            ANKI_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Reuses the cache from the previous step, so this is quick.
      - name: Load amd64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          tags: anki-sync-server:test
          build-args: |
            ANKI_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha

      - name: Smoke test
        run: |
          docker run -d --name anki -p 8080:8080 \
            -e SYNC_USER1=test:test \
            anki-sync-server:test
          for i in $(seq 1 30); do
            if docker exec anki anki-sync-server --healthcheck; then
              echo "Server is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "Server did not become healthy" >&2
          docker logs anki
          exit 1
